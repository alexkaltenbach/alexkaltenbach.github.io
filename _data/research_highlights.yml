qhgem:
  title: From a Gaussian to a bimodal density
  image: /images/research/qhgem-density-transport.svg
  width: 450
  height: 365
  alt: "The initial density is a single Gaussian peak. The computed final density has two peaks and closely follows the dashed orange target, with small remaining differences."
  caption: "An identified initial phase steers a Gaussian density towards a bimodal target through quantum-hydrodynamic dynamics. The final computed density closely follows the target, with a small remaining mismatch."
  source_label: "QH-GEM · Figure 4 reference data"
  source_url: https://github.com/alexkaltenbach/qh-gem-matlab/tree/117aa2ee2ea396aec22eaca6df6ae14d9b456376/reference_data
  papers:
    - title: "QH-GEM: Quantum-Hydrodynamic Generative Modeling"
      authors: H. Antil, A. Kaltenbach, S. Shah
      venue: Preprint
      year: 2026
      url: https://arxiv.org/abs/2608.27216
